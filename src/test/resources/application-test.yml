spring:
  datasource:
    hikari:
      maximum-pool-size: 10
  main:
    banner-mode: off

logging:
  level:
    root: warn
    com.mossyanwar.ordersinvoicing: info

app:
  scheduling:
    enabled: false
  security:
    # cheap hashing keeps the hundreds of authenticated test requests fast
    bcrypt-strength: 4
    users:
      - username: admin
        password: admin-test-password
        roles: [ADMIN]
      - username: clerk
        password: clerk-test-password
        roles: [CLERK]
      - username: viewer
        password: viewer-test-password
        roles: [VIEWER]
