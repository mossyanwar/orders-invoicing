spring:
  application:
    name: orders-invoicing
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
        # write updates in primary key order so two transactions touching the same invoices
        # lock them in the same order and cannot deadlock each other
        order_updates: true
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null

server:
  # finish in-flight requests before stopping, so a deploy does not cut a payment off half way
  shutdown: graceful

springdoc:
  # on for this project; set SPRINGDOC_API_DOCS_ENABLED=false and SPRINGDOC_SWAGGER_UI_ENABLED=false to hide them
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN

app:
  timezone: Europe/London
  # placeholder seller details printed on invoices; replace with the real business's
  seller:
    name: Example Trading Ltd
    address: "Unit 4, Example Park, Leeds LS1 4AB"
    vat-number: GB000000000
    email: accounts@example.test
  scheduling:
    enabled: true
  invoices:
    # five past midnight, UK time
    overdue-cron: "0 5 0 * * *"
  security:
    bcrypt-strength: 10
    # passwords have no defaults on purpose: set them in the environment (see README)
    users:
      - username: admin
        password: ${APP_ADMIN_PASSWORD:}
        roles: [ADMIN]
      - username: clerk
        password: ${APP_CLERK_PASSWORD:}
        roles: [CLERK]
      - username: viewer
        password: ${APP_VIEWER_PASSWORD:}
        roles: [VIEWER]
  idempotency:
    retention: PT24H
    cleanup-cron: "0 15 * * * *"
